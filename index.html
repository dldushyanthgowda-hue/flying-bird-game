<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flying Bird</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #70c5ce;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#70c5ce 0%, #b8f1f2 75%, #8ed081 75%);
}

#bird {
    position: absolute;
    width: 48px;
    height: 38px;
    left: 20%;
    top: 45%;
    z-index: 5;
    transition: transform 0.08s linear;
}

/* Bird body */
.bird-body {
    position: absolute;
    width: 38px;
    height: 30px;
    background: #f4c542;
    border-radius: 55% 50% 50% 55%;
    top: 4px;
    left: 3px;
    border: 2px solid #9a7512;
}

/* Eye */
.eye {
    position: absolute;
    width: 9px;
    height: 9px;
    background: white;
    border-radius: 50%;
    right: 7px;
    top: 6px;
    border: 1px solid #333;
}

.eye::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    background: #111;
    border-radius: 50%;
    top: 2px;
    left: 3px;
}

/* Beak */
.beak {
    position: absolute;
    width: 15px;
    height: 9px;
    background: #e87524;
    right: -7px;
    top: 15px;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* Wing */
.wing {
    position: absolute;
    width: 22px;
    height: 14px;
    background: #d9a92e;
    border-radius: 70% 20% 70% 20%;
    left: 3px;
    top: 18px;
    transform-origin: right center;
}

/* Tail */
.tail {
    position: absolute;
    width: 17px;
    height: 17px;
    background: #d9a92e;
    left: -8px;
    top: 10px;
    clip-path: polygon(100% 50%, 0 0, 20% 50%, 0 100%);
}

/* Score */
#score {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 2px 3px #555;
    z-index: 10;
}

#highScore {
    position: absolute;
    top: 75px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 1px 2px #555;
    z-index: 10;
}

/* Pipes */
.pipe {
    position: absolute;
    width: 65px;
    background: #58b947;
    border: 3px solid #357d2d;
    z-index: 3;
}

.pipe::after {
    content: "";
    position: absolute;
    left: -7px;
    width: 73px;
    height: 25px;
    background: #65c956;
    border: 3px solid #357d2d;
}

.pipe.top {
    top: 0;
}

.pipe.top::after {
    bottom: -3px;
}

.pipe.bottom {
    bottom: 0;
}

.pipe.bottom::after {
    top: -3px;
}

/* Start / Game Over panel */
#panel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

#panelContent {
    background: rgba(255,255,255,0.95);
    padding: 25px 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

#title {
    font-size: 32px;
    color: #333;
    margin-bottom: 10px;
}

#message {
    font-size: 20px;
    margin-bottom: 18px;
    color: #555;
}

button {
    border: none;
    background: #4caf50;
    color: white;
    font-size: 20px;
    font-weight: bold;
    padding: 12px 25px;
    border-radius: 10px;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

/* Ground */
#ground {
    position: absolute;
    bottom: 0;
    height: 25%;
    width: 100%;
    background:
        repeating-linear-gradient(
            45deg,
            #8ed081,
            #8ed081 12px,
            #7ac36a 12px,
            #7ac36a 24px
        );
    border-top: 5px solid #6aab55;
    z-index: 8;
}
</style>
</head>

<body>

<div id="game">

    <div id="score">0</div>
    <div id="highScore">🏆 High Score: 0</div>

    <div id="bird">
        <div class="bird-body"></div>
        <div class="eye"></div>
        <div class="beak"></div>
        <div class="wing"></div>
        <div class="tail"></div>
    </div>

    <div id="ground"></div>

    <div id="panel">
        <div id="panelContent">
            <div id="title">🐦 Flying Bird</div>
            <div id="message">Tap to fly!</div>
            <button id="startButton">Start Game</button>
        </div>
    </div>

</div>

<script>
const game = document.getElementById("game");
const bird = document.getElementById("bird");
const wing = document.querySelector(".wing");
const scoreText = document.getElementById("score");
const highScoreText = document.getElementById("highScore");

const panel = document.getElementById("panel");
const title = document.getElementById("title");
const message = document.getElementById("message");
const startButton = document.getElementById("startButton");

let birdY = 45;
let velocity = 0;

let gravity = 0.42;
let jumpStrength = -7.5;

let score = 0;
let highScore = Number(localStorage.getItem("flyingBirdHighScore")) || 0;

let pipes = [];
let gameRunning = false;
let animationFrame;
let pipeTimer;

let wingAngle = 0;
let wingDirection = 1;

highScoreText.textContent = "🏆 High Score: " + highScore;


/* -------------------------
   BIRD
------------------------- */

function flap() {
    if (!gameRunning) return;

    velocity = jumpStrength;

    // Wing flap
    wingAngle = -35;
}


/* -------------------------
   START GAME
------------------------- */

function startGame() {

    cancelAnimationFrame(animationFrame);
    clearInterval(pipeTimer);

    // Remove old pipes
    pipes.forEach(pipe => {
        pipe.top.remove();
        pipe.bottom.remove();
    });

    pipes = [];

    birdY = 45;
    velocity = 0;

    score = 0;
    scoreText.textContent = "0";

    gameRunning = true;

    panel.style.display = "none";

    createPipe();

    pipeTimer = setInterval(createPipe, 1800);

    animationFrame = requestAnimationFrame(gameLoop);
}


/* -------------------------
   CREATE PIPES
------------------------- */

function createPipe() {

    if (!gameRunning) return;

    const gameHeight = game.clientHeight;

    const gap = 170;

    const minimum = 80;
    const maximum = gameHeight - gap - 80;

    const topHeight =
        Math.floor(
            Math.random() * (maximum - minimum)
        ) + minimum;

    const topPipe = document.createElement("div");
    topPipe.className = "pipe top";

    const bottomPipe = document.createElement("div");
    bottomPipe.className = "pipe bottom";

    topPipe.style.height = topHeight + "px";
    bottomPipe.style.height =
        (gameHeight - topHeight - gap) + "px";

    topPipe.style.left = game.clientWidth + "px";
    bottomPipe.style.left = game.clientWidth + "px";

    game.appendChild(topPipe);
    game.appendChild(bottomPipe);

    pipes.push({
        top: topPipe,
        bottom: bottomPipe,
        x: game.clientWidth,
        passed: false
    });
}


/* -------------------------
   GAME LOOP
------------------------- */

function gameLoop() {

    if (!gameRunning) return;

    // Gravity
    velocity += gravity;
    birdY += velocity;

    // Keep bird inside screen
    if (birdY < 0) birdY = 0;

    bird.style.top = birdY + "%";

    // Realistic bird rotation
    let rotation = velocity * 4;

    if (rotation > 75) rotation = 75;
    if (rotation < -35) rotation = -35;

    bird.style.transform =
        "rotate(" + rotation + "deg)";

    // Wing animation
    wingAngle += wingDirection * 4;

    if (wingAngle > 25) {
        wingDirection = -1;
    }

    if (wingAngle < -35) {
        wingDirection = 1;
    }

    wing.style.transform =
        "rotate(" + wingAngle + "deg)";


    // Move pipes
    pipes.forEach(pipe => {

        pipe.x -= 3;

        pipe.top.style.left = pipe.x + "px";
        pipe.bottom.style.left = pipe.x + "px";

        // Score when bird passes pipe
        if (!pipe.passed &&
            pipe.x + 65 < bird.offsetLeft) {

            pipe.passed = true;

            score++;

            scoreText.textContent = score;

            if (score > highScore) {

                highScore = score;

                localStorage.setItem(
                    "flyingBirdHighScore",
                    highScore
                );

                highScoreText.textContent =
                    "🏆 High Score: " + highScore;
            }
        }
    });


    // Remove pipes that left screen
    pipes = pipes.filter(pipe => {

        if (pipe.x < -90) {

            pipe.top.remove();
            pipe.bottom.remove();

            return false;
        }

        return true;
    });


    // Collision
    if (checkCollision()) {
        gameOver();
        return;
    }

    animationFrame = requestAnimationFrame(gameLoop);
}


/* -------------------------
   COLLISION
------------------------- */

function checkCollision() {

    const birdRect = bird.getBoundingClientRect();

    // Ground collision
    const groundRect =
        document.getElementById("ground")
        .getBoundingClientRect();

    if (birdRect.bottom >= groundRect.top) {
        return true;
    }

    // Pipe collision
    for (const pipe of pipes) {

        const topRect =
            pipe.top.getBoundingClientRect();

        const bottomRect =
            pipe.bottom.getBoundingClientRect();

        if (
            rectanglesOverlap(birdRect, topRect) ||
            rectanglesOverlap(birdRect, bottomRect)
        ) {
            return true;
        }
    }

    return false;
}


function rectanglesOverlap(a, b) {

    return (
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}


/* -------------------------
   GAME OVER
------------------------- */

function gameOver() {

    gameRunning = false;

    cancelAnimationFrame(animationFrame);
    clearInterval(pipeTimer);

    title.textContent = "Game Over!";

    message.innerHTML =
        "Score: <b>" + score +
        "</b><br>🏆 High Score: <b>" +
        highScore + "</b>";

    startButton.textContent = "Play Again";

    panel.style.display = "flex";
}


/* -------------------------
   CONTROLS
------------------------- */

game.addEventListener("pointerdown", function(event) {

    // Don't flap when pressing the button
    if (event.target === startButton) return;

    flap();
});

startButton.addEventListener("click", function(event) {

    event.stopPropagation();

    startGame();
});


document.addEventListener("keydown", function(event) {

    if (
        event.code === "Space" ||
        event.code === "ArrowUp"
    ) {

        event.preventDefault();

        if (!gameRunning) {
            startGame();
        } else {
            flap();
        }
    }
});
</script>

</body>
</html>
