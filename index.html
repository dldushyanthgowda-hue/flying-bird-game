<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Flying Bird</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #70c5ce;
        font-family: Arial, sans-serif;
        touch-action: none;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
    }

    button {
        padding: 14px 30px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        background: white;
        color: #222;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #gameOverText {
        color: white;
        font-size: 32px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
        margin-bottom: 15px;
        display: none;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="message">
    <div id="gameOverText">Game Over</div>
    <button id="startButton">Start Game</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("startButton");
const gameOverText = document.getElementById("gameOverText");

let W = 0;
let H = 0;

let bird;
let pipes = [];
let score = 0;
let running = false;
let lastTime = 0;
let pipeTimer = 0;

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


function resetGame() {
    bird = {
        x: W * 0.25,
        y: H * 0.45,
        radius: 18,
        velocity: 0
    };

    pipes = [];
    score = 0;
    pipeTimer = 0;

    running = true;

    gameOverText.style.display = "none";
    startButton.style.display = "none";

    // Create the first pipe quickly
    createPipe();

    lastTime = performance.now();
}


function createPipe() {
    const gap = Math.max(150, H * 0.22);

    const minTop = 80;
    const maxTop = Math.max(
        minTop + 1,
        H - gap - 100
    );

    const top =
        minTop +
        Math.random() * (maxTop - minTop);

    pipes.push({
        x: W + 30,
        width: 65,
        top: top,
        gap: gap,
        passed: false
    });
}


function flap() {
    if (!running) return;

    bird.velocity = -330;
}


function checkCollision(pipe) {

    const left = bird.x - bird.radius;
    const right = bird.x + bird.radius;
    const top = bird.y - bird.radius;
    const bottom = bird.y + bird.radius;

    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + pipe.width;

    // Is bird horizontally touching pipe?
    if (right < pipeLeft || left > pipeRight) {
        return false;
    }

    // Hit upper pipe
    if (top < pipe.top) {
        return true;
    }

    // Hit lower pipe
    if (bottom > pipe.top + pipe.gap) {
        return true;
    }

    return false;
}


function endGame() {
    running = false;

    gameOverText.textContent =
        "Game Over  •  Score: " + score;

    gameOverText.style.display = "block";
    startButton.textContent = "Play Again";
    startButton.style.display = "inline-block";
}


function update(dt) {

    if (!running) return;

    // Gravity
    bird.velocity += 850 * dt;

    // Bird movement
    bird.y += bird.velocity * dt;

    // Pipe timer
    pipeTimer += dt;

    if (pipeTimer >= 1.7) {
        createPipe();
        pipeTimer = 0;
    }

    // Move pipes
    for (let i = pipes.length - 1; i >= 0; i--) {

        const pipe = pipes[i];

        pipe.x -= 190 * dt;

        // Score
        if (
            !pipe.passed &&
            pipe.x + pipe.width < bird.x
        ) {
            pipe.passed = true;
            score++;
        }

        // Collision
        if (checkCollision(pipe)) {
            endGame();
            return;
        }

        // Remove old pipes
        if (pipe.x + pipe.width < -20) {
            pipes.splice(i, 1);
        }
    }

    // Ceiling and floor
    if (
        bird.y - bird.radius <= 0 ||
        bird.y + bird.radius >= H
    ) {
        endGame();
    }
}


function drawBackground() {

    // Sky
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, W, H);

    // Clouds
    ctx.fillStyle = "rgba(255,255,255,0.75)";

    ctx.beginPath();
    ctx.arc(W * 0.18, H * 0.15, 25, 0, Math.PI * 2);
    ctx.arc(W * 0.22, H * 0.14, 35, 0, Math.PI * 2);
    ctx.arc(W * 0.27, H * 0.16, 25, 0, Math.PI * 2);
    ctx.fill();
}


function drawBird() {

    // Body
    ctx.fillStyle = "#ffd83d";

    ctx.beginPath();
    ctx.arc(
        bird.x,
        bird.y,
        bird.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Wing
    ctx.fillStyle = "#e8a900";

    ctx.beginPath();
    ctx.ellipse(
        bird.x - 5,
        bird.y + 5,
        10,
        6,
        -0.3,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Eye
    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(
        bird.x + 7,
        bird.y - 7,
        6,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(
        bird.x + 9,
        bird.y - 7,
        3,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Beak
    ctx.fillStyle = "#ff8c00";

    ctx.beginPath();
    ctx.moveTo(bird.x + 15, bird.y);
    ctx.lineTo(bird.x + 32, bird.y + 7);
    ctx.lineTo(bird.x + 15, bird.y + 12);
    ctx.closePath();
    ctx.fill();
}


function drawPipes() {

    for (const pipe of pipes) {

        ctx.fillStyle = "#48a938";

        // Upper pipe
        ctx.fillRect(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        // Lower pipe
        ctx.fillRect(
            pipe.x,
            pipe.top + pipe.gap,
            pipe.width,
            H
        );

        // Pipe edges
        ctx.fillStyle = "#35852b";

        ctx.fillRect(
            pipe.x - 5,
            pipe.top - 15,
            pipe.width + 10,
            15
        );

        ctx.fillRect(
            pipe.x - 5,
            pipe.top + pipe.gap,
            pipe.width + 10,
            15
        );
    }
}


function drawScore() {

    ctx.font = "bold 45px Arial";
    ctx.textAlign = "center";

    ctx.lineWidth = 5;
    ctx.strokeStyle = "black";

    ctx.strokeText(
        score,
        W / 2,
        65
    );

    ctx.fillStyle = "white";

    ctx.fillText(
        score,
        W / 2,
        65
    );
}


function draw() {

    drawBackground();
    drawPipes();

    if (bird) {
        drawBird();
    }

    drawScore();
}


function gameLoop(time) {

    let dt = (time - lastTime) / 1000;

    // Prevent huge time jumps
    dt = Math.min(dt, 0.03);

    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}


startButton.addEventListener("click", function(event) {
    event.stopPropagation();
    resetGame();
});


canvas.addEventListener("pointerdown", function() {
    flap();
});


window.addEventListener("keydown", function(event) {

    if (
        event.code === "Space" ||
        event.code === "ArrowUp"
    ) {
        event.preventDefault();
        flap();
    }

});


resetGame();
running = false;

gameOverText.style.display = "none";
startButton.textContent = "Start Game";

lastTime = performance.now();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
